# Disables Ctrl+Alt+F1-F12 virtual-terminal switching for the duration of the
# X session. Found on real hardware (2026-07-31): LightDM's Xorg is already
# launched with -novtswitch, but that flag only controls whether the server
# force-switches VTs on its own startup/exit — it does nothing about the
# Ctrl+Alt+Fn hotkey during a running session, which dropped straight to a
# text-mode getty console with no easy way back for a non-technical teacher.
# DontVTSwitch is the separate, correct setting for that: the X server stops
# passing the VT-switch keysyms through to the kernel console driver at all.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
EndSection
