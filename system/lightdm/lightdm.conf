# Installed as a drop-in at /etc/lightdm/lightdm.conf.d/50-classpad.conf by
# scripts/install.sh — never overwrite the package-provided
# /etc/lightdm/lightdm.conf itself, so this stays a one-file rollback
# (`rm /etc/lightdm/lightdm.conf.d/50-classpad.conf`) if autologin ever needs
# to be backed out on a machine.
#
# autologin-session must match a filename under /usr/share/xsessions/
# (openbox.desktop on this image -> session name "openbox"), not the
# openbox-session binary name.
[Seat:*]
autologin-user=classpad
autologin-user-timeout=0
autologin-session=openbox
