# Classpad unattended-install preseed, for use with
# scripts/build-provisioning-usb.sh / .ps1 — copied onto an already-written
# Debian netinst USB stick (Rufus "ISO Image mode" or equivalent), not baked
# into a rebuilt ISO. See CLAUDE.md's "Provisioning / Imaging" section for
# why there's no ISO-generator step anymore.
#
# Scope: gets a bare 11e from "boot the USB" to "scripts/install.sh has run
# as root". Everything classpad-specific (packages, the classpad user,
# systemd units, hostname-from-serial, WiFi, ...) is install.sh's job, not
# this file's — see the late_command at the bottom. Keeping that split
# means this preseed never needs editing when install.sh changes.
#
# Assumes: wired Ethernet + DHCP on whatever bench these are imaged on
# (confirmed for this deployment) — d-i's own network stage only needs to
# reach the AARNet mirror for base packages. The classroom's WPA2-Enterprise
# WiFi is deliberately NOT configured here — see CLAUDE.md's "Provisioning /
# Imaging" section: WiFi provisioning is a fresh-design-pass, first-boot
# concern (scripts/wifi-configure.sh), not an install-time one.
#
# Interface is pinned to enp2s0 (the 11e's onboard wired NIC), not `auto` —
# `auto` silently picks whichever interface link-detects first, which on a
# bench with other USB/dock NICs plugged in isn't guaranteed to be the
# right one. If a given unit's onboard NIC isn't actually enp2s0 (different
# hardware revision, PCI topology, ...), d-i's network stage will fail to
# find it rather than silently using the wrong interface — check with `ip
# link` on that unit and adjust this line if so, rather than reverting to
# `auto`.
#
# @@USER_PASSWORD_CRYPTED@@ below is substituted by the build script from
# CLASSPAD_USER_PASSWORD_CRYPTED (generate with: mkpasswd -m sha-512) — this
# file is a template, never a real credential. The build scripts refuse to
# run with that variable unset, specifically so a real crypted password can
# never accidentally ship as this repo's own committed placeholder.

### Localization
d-i debian-installer/locale string en_AU.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Australia/Melbourne
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network (d-i's own stage — wired DHCP only, see header)
d-i netcfg/choose_interface select enp2s0
d-i netcfg/link_detection_timeout string 10
d-i netcfg/disable_dhcp boolean false
# Overwritten at first boot by install.sh (step "hostname from serial
# number", via dmidecode) — the value here genuinely doesn't matter, it
# just has to be present so d-i doesn't stop to ask.
d-i netcfg/get_hostname string unassigned
d-i netcfg/get_domain string unassigned
d-i netcfg/wireless_wep string

### Mirror: AARNet, pinned explicitly rather than relying on
### deb.debian.org's geoip redirect.
d-i mirror/country string manual
d-i mirror/http/countrycode string AU
d-i mirror/http/hostname string mirror.aarnet.edu.au
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/security_host string mirror.aarnet.edu.au
d-i apt-setup/security_path string /debian-security

### Account setup — root login disabled; a single sudo-capable local admin
### account for physical/console access. This is NOT the "classpad" kiosk
### user — that account, its autologin, and its groups are all created by
### scripts/install.sh, same as on a manually-provisioned machine, so that
### logic stays in the one place that already owns it.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Classpad Admin
d-i passwd/username string sysadmin
d-i passwd/user-password-crypted password @@USER_PASSWORD_CRYPTED@@
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false
d-i passwd/user-default-groups string sudo

### Partitioning — whole-disk, guided, no LVM. These are single-purpose
### kiosk boxes with no resize/snapshot need, so LVM would only add a layer
### with nothing to show for it. Disk is pinned to /dev/sda rather than
### left for partman-auto to pick — with more than one block device
### visible (the installer's own USB stick is one), partman-auto/disk
### unset means d-i stops and asks which disk to use, which breaks
### unattended install. If a given unit's target disk genuinely isn't
### /dev/sda (NVMe would enumerate as /dev/nvme0n1, for example), check
### with `lsblk` on that unit and adjust this line.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

### Base system — deliberately minimal. scripts/install.sh installs every
### classpad-specific package itself (see CLAUDE.md "Required packages"),
### so tasksel has no desktop task to pull in here. This is exactly why
### install.sh's own `systemctl set-default graphical.target` step matters
### — a "standard" tasksel install has no reason to ever reach
### graphical.target on its own, and without that step the machine boots to
### a text-mode login instead of LightDM. openssh-server is included for
### remote admin access to the "sysadmin" account above — there is no other
### remote-access path to these machines once deployed.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### Provisioning — run scripts/install.sh from a copy of this repo bundled
### directly on the install medium (see scripts/build-provisioning-usb.sh),
### not fetched from classpad-admin or GitHub. This is the whole point of
### bundling it on the USB: base provisioning has zero dependency on the
### server being reachable — it's an enhancement to an already-provisioned
### fleet (plugin sync, config, telemetry), not a gate on getting a fresh
### machine stood up. See CLAUDE.md's Central Server section for the same
### "server enhances, doesn't gate" principle applied to the running client.
###
### chmod: the USB is FAT32 (see build-provisioning-usb.sh/.ps1), which has
### no concept of a Unix exec bit, so classpad-src's scripts may land here
### with none set regardless of what they had in the repo. install.sh
### itself is invoked via `bash <path>` so that alone doesn't need it, but
### install.sh's own children (plugin-install.sh, recovery.sh, ...) are
### exec'd directly later at runtime — fix it once, right after the copy.
### Run directly against /target/... from d-i's own shell (which already
### has plain filesystem access to it) rather than nesting a second `find`
### inside `in-target bash -c "..."` — that's three layers of quoting
### (debconf continuation line, in-target's own argv handling, bash -c)
### for something that doesn't need a chroot at all.
###
### CLASSPAD_SKIP_REBOOT=1: install.sh reboots itself at the very end
### (step 15/15) — but this runs inside d-i's `in-target` chroot, where
### there's no init/systemd actually running to honor a raw `reboot` call
### mid-sequence. d-i's own finish-install step does the one real reboot
### once late_command returns, so install.sh's automatic reboot is
### deliberately suppressed here, not skipped by accident. (install.sh
### also guards its own `systemctl ... --now`/`daemon-reload` calls behind
### a live-systemd check for the same chroot reason — see
### `enable_and_start_if_live` in install.sh itself.)
###
### install.sh's own stdout/stderr is captured to a log file that survives
### on the real disk regardless of outcome, and classpad-src is only
### deleted on success — a v1 preseed did neither of these, so a failed
### install.sh left nothing behind to explain what happened. Exiting with
### install.sh's own status makes a genuine failure halt d-i with a visible
### error instead of silently rebooting into a half-provisioned machine;
### whoever's provisioning is standing at the bench, not remote, so a halt
### here is a feature, not a hazard.
d-i preseed/late_command string \
    cp -a /cdrom/classpad-src /target/opt/classpad-src ; \
    find /target/opt/classpad-src -name '*.sh' -exec chmod 755 {} + ; \
    find /target/opt/classpad-src -name '*.py' -exec chmod 755 {} + ; \
    in-target env CLASSPAD_SKIP_REBOOT=1 bash /opt/classpad-src/scripts/install.sh > /target/var/log/classpad-install.log 2>&1 ; \
    install_status=$? ; \
    if [ "$install_status" -eq 0 ]; then in-target rm -rf /opt/classpad-src ; fi ; \
    exit "$install_status"
