services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      # No defaults on purpose — server/app.py refuses to start without
      # these. Set them in the shell or a server/.env file (gitignored),
      # never committed.
      - CLASSPAD_ADMIN_USERNAME=${CLASSPAD_ADMIN_USERNAME:?set in .env or the shell}
      - CLASSPAD_ADMIN_PASSWORD=${CLASSPAD_ADMIN_PASSWORD:?set in .env or the shell}
      - CLASSPAD_SECRET_KEY=${CLASSPAD_SECRET_KEY:?set in .env or the shell}
    volumes:
      - classpad_data:/data
    restart: unless-stopped

volumes:
  classpad_data:
